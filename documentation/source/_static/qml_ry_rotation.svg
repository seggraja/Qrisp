<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker>
  </defs>
  <rect width="640" height="340" rx="10" fill="#ffffff"/>
  <text x="170" y="24" text-anchor="middle" font-size="13" fill="#57606a">a slice through the Bloch sphere</text>

  <circle cx="170" cy="180" r="120" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <line x1="170" y1="60" x2="170" y2="300" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- height of the state = <Z> -->
  <line x1="273.9" y1="120.0" x2="170" y2="120.0" stroke="#1a7f37" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="170" y1="180" x2="170" y2="120.0" stroke="#1a7f37" stroke-width="5"/>
  <text x="160" y="155.0" text-anchor="end" fill="#1a7f37"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">⟨</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">Z</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">⟩ = cos </tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan></text>

  <!-- the state -->
  <line x1="170" y1="180" x2="273.9" y2="120.0" stroke="#0969da" stroke-width="3" marker-end="url(#st)"/>
  <path d="M 170 140 A 40 40 0 0 1 204.6 160.0" fill="none" stroke="#24292f" stroke-width="1.2"/>
  <text x="198.0" y="135.5" text-anchor="middle"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan></text>
  <text x="285.9" y="120.0" fill="#0969da"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">R</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic" font-size="11" dy="4">Y</tspan><tspan dy="-4"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">(</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">)|0⟩</tspan></tspan></text>

  <!-- landmarks -->
  <circle cx="170" cy="60" r="5" fill="#24292f"/>
  <circle cx="170" cy="300" r="5" fill="#24292f"/>
  <circle cx="290" cy="180" r="4" fill="#8c959f"/>
  <text x="170" y="48" text-anchor="middle" font-size="17"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">|0⟩</tspan></text>
  <text x="170" y="326" text-anchor="middle" font-size="17"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">|1⟩</tspan></text>
  <text x="158" y="65" text-anchor="end" font-size="13" fill="#57606a"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif"> = 0</tspan></text>
  <text x="158" y="305" text-anchor="end" font-size="13" fill="#57606a"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif"> = π</tspan></text>
  <text x="300" y="185" font-size="13" fill="#57606a"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif"> = π/2</tspan></text>

  <!-- reading the picture -->
  <g font-size="15">
    <text x="390" y="70" font-weight="bold">Rotating <tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">|0⟩</tspan> by <tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan></text>
    <text x="390" y="104"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif"> = 0</tspan>  →  <tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">|0⟩</tspan>, always measure 0</text>
    <text x="390" y="132"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif"> = π/2</tspan>  →  equal superposition,</text>
    <text x="440" y="152">measure 1 half the time</text>
    <text x="390" y="180"><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif"> = π</tspan>  →  <tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">|1⟩</tspan>, always measure 1</text>
    <text x="390" y="224">state: <tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">cos(</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">/2) |0⟩ + sin(</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">/2) |1⟩</tspan></text>
    <text x="390" y="250">probability of 1: <tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">sin²(</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">θ</tspan><tspan font-family="Latin Modern Math, STIX Two Math, Cambria Math, Times New Roman, serif">/2)</tspan></text>
  </g>
</svg>
