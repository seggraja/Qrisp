  <text x="198.8" y="246.8" text-anchor="end" font-size="13" font-weight="bold" fill="#bc4c00">next point</text>
  <text x="40" y="388" class="rule" text-anchor="start">1. Pick a random direction: each parameter +1 or −1.</text>
  <text x="40" y="407" class="rule" text-anchor="start">2. Compute the loss a small distance along it and</text>
  <text x="40" y="426" class="rule" text-anchor="start">    against it (the two squares): 2 loss evaluations.</text>
  <text x="40" y="445" class="rule" text-anchor="start">3. Step along the same line, towards the lower loss.</text>
  <text x="40" y="464" class="rule" text-anchor="start">    The bigger the difference, the bigger the step.</text>
  <rect x="480" y="60" width="300" height="300" fill="#ffffff" stroke="#d0d7de"/>
