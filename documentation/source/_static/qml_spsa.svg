  <text x="480" y="436" class="caption" text-anchor="start">about the same loss, the step is almost zero.</text>
  <text x="480" y="454" class="caption" text-anchor="start">minimize returns the last point, not the best one seen.</text>
  <text x="20" y="496" class="caption" font-style="italic">Distances are enlarged for readability. Grey lines: equal loss; ×: lowest loss.</text>
